<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tube Grabber</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #ff4d4d;
    --accent-soft: #ff4d4d22;
    --text: #f2f2f2;
    --muted: #9aa0aa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url("nature.jpg") no-repeat center center fixed;
    background-size: cover;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid #262a33;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 26px;
  }
  h1 span { color: var(--accent); }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #2c313c;
    background: #10131a;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #result {
    margin-top: 24px;
    display: none;
  }
  #result.show { display: block; }
  .thumb-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
  }
  .thumb-wrap img {
    width: 100%;
    display: block;
    opacity: 0.85;
  }
  .video-title {
    margin: 14px 0 4px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
  }
  .video-meta {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  a.download-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--accent);
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
  }
  #status {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  #status.error { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Tube<span>Grabber</span></h1>
    <p class="sub">simple YouTube video downloader by Ilyes</p>

    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="findBtn">Find</button>
    </div>

    <div id="status"></div>

    <div id="result">
      <div class="thumb-wrap">
        <img id="thumb" src="" alt="thumbnail" />
      </div>
      <div class="video-title" id="title"></div>
      <div class="video-meta" id="meta"></div>
      <a class="download-btn" id="downloadBtn" href="#">⬇ Download Video</a>
    </div>
  </div>

<script>
  const urlInput = document.getElementById("urlInput");
  const findBtn = document.getElementById("findBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const thumbEl = document.getElementById("thumb");
  const titleEl = document.getElementById("title");
  const metaEl = document.getElementById("meta");
  const downloadBtn = document.getElementById("downloadBtn");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function formatDuration(seconds) {
    seconds = parseInt(seconds, 10);
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  async function findVideo() {
    const url = urlInput.value.trim();
    if (!url) return;

    resultEl.classList.remove("show");
    setStatus("Looking that up...");
    findBtn.disabled = true;

    try {
      const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || "Something went wrong.", true);
        return;
      }

      thumbEl.src = data.thumbnail;
      titleEl.textContent = data.title;
      metaEl.textContent = `${data.author} • ${formatDuration(data.lengthSeconds)}`;
      downloadBtn.href = `/api/download?url=${encodeURIComponent(url)}`;

      resultEl.classList.add("show");
      setStatus("");
    } catch (err) {
      setStatus("Couldn't reach the server. Is it running?", true);
    } finally {
      findBtn.disabled = false;
    }
  }

  findBtn.addEventListener("click", findVideo);
  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") findVideo();
  });
</script>

</body>
</html>
